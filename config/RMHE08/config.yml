# Path to the main.dol file.
object: orig/RMHE08/sys/main.dol
# (optional) SHA-1 hash of the main.dol file for verification.
hash: BF4850739478CAAEDFE675949EB7C28595A7FDE9
# (optional) Name override. Defaults to "main".
name: main

mw_comment_version: 14

# (optional) Path to the symbols.txt file.
# This file will be created if it does not exist.
# See docs/symbols.md for more information.
symbols: config/RMHE08/symbols.txt
# (optional) Path to the splits.txt file.
# This file will be created if it does not exist.
# See docs/splits.md for more information.
splits: config/RMHE08/splits.txt

# (optional) Path to `selfile.sel` for Wii games with RSO files.
selfile: orig/RMHE08/files/mh3.sel
# (optional) SHA-1 hash of the `selfile.sel` file for verification.
selfile_hash: 0233F8569C319224DA81EFF14C5CB25AE10F9546

# (optional) When enabled, function boundary analysis will be skipped.
# Only valid _after_ initial analysis has been performed and
# the symbols and splits files have been generated. 
quick_analysis: true

# (optional) When enabled, the analyzer will attempt to detect sizes
# and data types of objects based on code usage and alignment.
detect_objects: true

# (optional) When enabled, the analyzer will attempt to detect strings,
# wide strings, and string tables.
detect_strings: true

# (optional) Whether to write disassembly to the split output directory.
# While not used in the build process, the disassembly is useful
# for reading and usage with other tools, like decomp.me.
#
# Off on purpose: nothing in the build reads build/RMHE08/asm (`config.asm_dir` is None and no ninja
# edge names it), and writing it *is* the cost of a split - 92 MB across 13 500 files, measured at
# ~18 s with it off against 200-400 s with it on, on *every* run, because symbols.txt is one of the
# split's dirty-check inputs. `tools/splits/tudiscover.py` is the one reader, so regenerate the dump
# on demand with `python tools/splits/dump_asm.py`; `tudiscover stats` says when it has gone stale.
# Measurements: docs/build-performance.md.
write_asm: false

# (optional) If symbols are _fully_ known (e.g. from a complete map file),
# this can be set to true to skip most analysis steps, and ensure new
# symbols are not created by the analyzer.
# If you're not sure, leave this false.
symbols_known: false

# (optional) Whether to create `gap_` symbols to prevent the linker from
# adjusting the alignment / address of symbols.
# When alignments are fully known (e.g. from a complete map file),
# this can be set to false.
fill_gaps: true

# dtk reads the NETWORK_ERROR_* immediates (0x80020001/2, 0x80030002..0x8003004B) as
# addresses and relocates them against extabindex labels; they are plain constants.
# Measured (network pilot, L1): 21 functions up, 0 down, main.dol unchanged.
block_relocations:
- target: extabindex:0x80020000
  end: extabindex:0x80020010
- target: extabindex:0x80030000
  end: extabindex:0x80030050
# The error code 0x80060034 that updateSession loads (lis/addi at 0x803D7564) is a constant, not
# fn_8005FE68+0x1CC.
- source: .text:0x803D7564
  end: .text:0x803D756C
# The same code in NetworkLayerPat::handleConnect (lis/addi at 0x803E30F4).
- source: .text:0x803E30F4
  end: .text:0x803E30FC
# The same code in NetworkCommunityPat::handle_68 (lis/addi at 0x803F17F8).
- source: .text:0x803F17F8
  end: .text:0x803F1800
# The fetcher's busy code 0x800A0004 (lis/addi in open, read, list, close and queryChecksum) is a constant,
# not fn_8009F85C+0x7A8.
- source: .text:0x803F67A0
  end: .text:0x803F67A8
- source: .text:0x803F68C0
  end: .text:0x803F68C8
- source: .text:0x803F69A0
  end: .text:0x803F69A8
- source: .text:0x803F6A54
  end: .text:0x803F6A5C
- source: .text:0x803F6AD8
  end: .text:0x803F6AE0
# NetworkSocketWii's error sources 0x80010001..0x80010015 (lis/addi pairs) are constants, not @etb_8000FFFC+N,
# @etb_8001000C+N or @etb_80010014+N.
